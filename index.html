<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030507;
            --panel: rgba(6, 12, 16, 0.78);
            --line: rgba(110, 220, 255, 0.28);
            --accent: #6edcff;
            --ok: #62f08a;
            --warn: #ffc94a;
            --danger: #ff4a3d;
            --text: #d6e6ee;
            --muted: #7d95a3;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }
        canvas#view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
        .panel {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 8px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }
        #hud { top: 12px; left: 12px; min-width: 300px; max-width: 460px; white-space: pre; }
        #hud .t { color: var(--accent); letter-spacing: 0.12em; }
        #hud .on { color: var(--ok); }
        #hud .off { color: var(--muted); }
        #hud .w { color: var(--warn); }
        #hud .d { color: var(--danger); }
        #map { position: fixed; top: 12px; right: 12px; width: 300px; height: 300px; border: 1px solid var(--line); background: rgba(4, 8, 11, 0.8); cursor: pointer; }
        #help { bottom: 12px; left: 12px; white-space: pre; color: var(--muted); }
        #help b { color: var(--text); font-weight: normal; }
        #toast { top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--warn); font-size: 16px; display: none; }
        #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border: 1px solid rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; }
        #fallback { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; background: var(--bg); padding: 16px; }
        #fallback.show { display: flex; }
        .card { max-width: 480px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--danger); padding: 14px 16px; }
        .tag { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--danger); }
        h1 { margin: 4px 0 2px; font-size: 24px; letter-spacing: 0.04em; text-transform: uppercase; }
        .desc { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
        #fallback pre { white-space: pre-wrap; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--danger); background: rgba(0,0,0,0.4); padding: 10px; margin: 10px 0 0; max-height: 40vh; overflow: auto; }
        #loader { display: none; position: fixed; inset: 0; z-index: 40; align-items: center; justify-content: center; background: rgba(3, 5, 7, 0.9); padding: 16px; }
        #loader.show { display: flex; }
        #loader .card { border-left-color: var(--accent); }
        #loader .tag { color: var(--accent); }
        #loader-message { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--warn); margin: 0 0 12px; }
        #loader label { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 12px; cursor: pointer; }
        #loader label:hover { border-color: var(--accent); }
        #loader input { display: none; }
        #load-button { position: fixed; right: 12px; bottom: 12px; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 12px; cursor: pointer; }
        #load-button:hover { border-color: var(--accent); color: var(--accent); }
        /* above the fault card too, so another GPU can be tried from there */
        .gpu-pick { position: fixed; right: 12px; bottom: 46px; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; background: var(--panel); border: 1px solid var(--line); font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); }
        .gpu-pick select { max-width: 400px; background: #0a141a; color: var(--text); border: 1px solid var(--line); font: inherit; padding: 2px 4px; cursor: pointer; }
        .gpu-pick select:hover, .gpu-pick select:focus { border-color: var(--accent); outline: none; }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <div id="crosshair"></div>
    <div id="hud" class="panel"></div>
    <canvas id="map" title="Minimap: click to teleport"></canvas>
    <div id="help" class="panel"></div>
    <div id="toast" class="panel"></div>
    <button id="load-button" title="Load a scenario .json from disk (L)">Load scenario…</button>
    <div id="loader">
        <div class="card">
            <div class="tag">SCENARIO</div>
            <h1>Load a scenario</h1>
            <p class="desc">Pick a scenario .json (e.g. scenarios/bunker-compound.json) or drop one on the page.</p>
            <p id="loader-message"></p>
            <label>Choose file…<input id="loader-file" type="file" accept=".json,application/json"></label>
        </div>
    </div>
    <div id="fallback">
        <div class="card">
            <div class="tag">SYSTEM FAULT</div>
            <h1>WebGPU unavailable</h1>
            <p class="desc">This demo needs WebGPU (Chrome/Edge 113+, or Brave with WebGPU enabled in brave://flags).</p>
            <pre id="error-message">navigator.gpu is undefined</pre>
        </div>
    </div>

    <!-- Classic scripts (not ES modules) so the demo also runs when opened straight from disk.
         The world comes from a scenario .json (scenarios/), see js/scenario-loader.js. -->
    <!-- core -->
    <script src="js/core/config.js"></script>
    <script src="js/core/math.js"></script>
    <script src="js/core/geometry2d.js"></script>
    <script src="js/core/frustum.js"></script>
    <!-- rendering -->
    <script src="js/render/mesh.js"></script>
    <script src="js/render/materials.js"></script>
    <script src="js/render/shaders.js"></script>
    <script src="js/render/gpu-choice.js"></script>
    <script src="js/render/renderer.js"></script>
    <script src="js/render/frame-builder.js"></script>
    <script src="js/render/debug-lines.js"></script>
    <!-- visibility -->
    <script src="js/vis/object-trees.js"></script>
    <script src="js/vis/portal-vis.js"></script>
    <!-- world -->
    <script src="js/world/collision.js"></script>
    <script src="js/world/area.js"></script>
    <script src="js/world/portal.js"></script>
    <script src="js/world/architecture.js"></script>
    <script src="js/world/outdoors.js"></script>
    <script src="js/world/nav-graph.js"></script>
    <script src="js/world/vehicle.js"></script>
    <script src="js/world/entities.js"></script>
    <script src="js/world/world.js"></script>
    <!-- game -->
    <script src="js/game/player.js"></script>
    <script src="js/game/input.js"></script>
    <script src="js/game/hud.js"></script>
    <script src="js/game/minimap.js"></script>
    <script src="js/game/game.js"></script>
    <!-- default scenario, embedded for pages opened from disk (generated: node tools/embed-scenarios.mjs) -->
    <script src="scenarios/bunker-compound.js"></script>
    <!-- scenario loading + entry point -->
    <script src="js/scenario-loader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
